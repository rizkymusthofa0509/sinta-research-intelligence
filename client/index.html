<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Open Knowledge Mapping — a visual interface to Indonesian scientific knowledge, crawled live from Garuda and SINTA." />
    <title>Open Knowledge Mapping</title>
    <script>
      // Apply a saved theme before first paint (avoids a light flash in dark mode).
      try {
        var t = localStorage.getItem('okm-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  </head>

  </body>
